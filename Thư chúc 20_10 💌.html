<!DOCTYPE html>
<html lang="vi" data-theme="light" style="color-scheme: light;" data-qb-installed="true"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thư chúc 20/10 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Pacifico&amp;display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#1d0e2a;--glow:#ff7a45;--text:#fbe9f0;--muted:#d9b7c8;--env-back:#c9456b;--env-front:#ee7a98;--env-flap:#f79bb2;--seal:#ffe3a3;--seal-ink:#8a2346;--paper:#fffbfd;--ink:#3b1b33;--accent:#c9456b;--overlay:rgba(18,6,26,.72)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#fde8ef;--glow:#ffb48f;--text:#4a1d3d;--muted:#7d4b69;--overlay:rgba(74,29,61,.55)}}
:root[data-theme="dark"]{color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 80px;text-align:center;font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background-color:var(--bg);background-image:radial-gradient(ellipse 80% 45% at 50% 105%,var(--glow) 0,transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{width:100%;display:flex;flex-direction:column;align-items:center;gap:20px}
h1{font-family:Pacifico,"Segoe Script",cursive;font-weight:400;font-size:clamp(1.7rem,7vw,2.6rem);line-height:1.3;margin:0}
.sub{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.list{display:flex;flex-direction:column;gap:12px;width:min(100%,360px)}
.pick{display:flex;align-items:center;gap:12px;padding:14px 18px;border:0;border-radius:14px;cursor:pointer;background:var(--paper);color:var(--ink);font:500 1rem "Be Vietnam Pro",system-ui,sans-serif;text-align:left;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.pick span{font-size:1.6rem}
.ghost{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:6px 10px}
.envelope{--w:min(84vw,340px);--h:calc(var(--w)*.66);position:relative;width:var(--w);height:var(--h);perspective:900px;background:none;border:0;padding:0;cursor:pointer;filter:drop-shadow(0 18px 24px rgba(0,0,0,.35))}
.envelope:focus-visible,.close:focus-visible{outline:3px solid var(--seal);outline-offset:6px}
.back{position:absolute;inset:0;background:var(--env-back);border-radius:8px}
.card{position:absolute;left:7%;right:7%;top:10%;height:80%;background:var(--paper);border-radius:4px;z-index:2;transition:transform .8s ease .35s;padding:14px 16px}
.card i{display:block;height:5px;border-radius:3px;background:#ecd3de;margin-bottom:9px}.card i:nth-child(2){width:80%}.card i:nth-child(3){width:60%}
.pocket{position:absolute;inset:0;background:var(--env-front);border-radius:8px;z-index:3;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:62%;background:var(--env-flap);z-index:4;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .7s ease,z-index 0s .35s}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:54px;height:54px;border-radius:50%;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font-weight:600;font-size:.82rem;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:opacity .25s,transform .25s}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}.envelope.open .card{transform:translateY(-38%)}.envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.6)}
.hint{margin:0;color:var(--muted);font-size:.9rem}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--overlay);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.overlay.show{opacity:1;visibility:visible;transition:opacity .35s}
.letter{width:min(100%,520px);max-height:100%;overflow-y:auto;background:var(--paper);color:var(--ink);border-radius:10px;padding:32px 28px 24px;text-align:left;line-height:1.7;box-shadow:0 24px 60px rgba(0,0,0,.4);transform:translateY(24px) scale(.96);transition:transform .45s ease;border-top:6px solid var(--accent)}
.overlay.show .letter{transform:none}
.letter h2{font-family:Pacifico,"Segoe Script",cursive;font-weight:400;font-size:1.5rem;color:var(--accent);margin:0 0 14px;line-height:1.35}
.letter p{margin:0 0 14px}.sign{margin-top:20px;font-weight:500}
.pic{display:block;width:100%;height:auto;border-radius:6px;margin:6px 0 16px}
.btn,.close{display:inline-block;padding:10px 22px;border:0;border-radius:999px;cursor:pointer;background:var(--accent);color:#fff;font:500 .95rem "Be Vietnam Pro",system-ui,sans-serif}
.close{display:block;margin:18px auto 0}
.btn.alt{background:none;color:var(--ink);border:1px solid #d9b7c8}
.meme{margin:0;width:min(92vw,420px)}.meme img{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.panel{width:min(100%,560px);background:var(--paper);color:var(--ink);border-radius:12px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--accent)}
.panel h2{margin:0;font-size:1.2rem}
.panel label{font-size:.82rem;font-weight:500;display:flex;flex-direction:column;gap:4px}
.panel input,.panel textarea,.panel select{font:1rem "Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:#fff;border:1px solid #e3c6d3;border-radius:8px;padding:8px 10px;width:100%}
.panel textarea{min-height:200px;resize:vertical}.panel textarea.s{min-height:60px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}.t{position:relative}.t img{width:72px;height:72px;object-fit:cover;border-radius:6px;display:block}
.t button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;line-height:1}
.pin{text-align:center;letter-spacing:.35em;font:600 1.4rem "Be Vietnam Pro",system-ui,sans-serif;width:min(70vw,220px);padding:10px;border-radius:10px;border:0;background:var(--paper);color:var(--ink)}
.err{margin:0;min-height:1.4em;color:var(--seal);font-size:.9rem}
.note{font-size:.82rem;color:#7d4b69;margin:0}
code{background:#f6e3ec;padding:2px 6px;border-radius:4px;word-break:break-all}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>

<script>
(function(){
var S=JSON.parse(document.getElementById('data').textContent),app=document.getElementById('app');
var cap=null,canEdit=false,editing=false,preview=false,sel=0,cur=null,hashMode=false,msgEl=null,delArm=false;
function $(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function find(id){for(var i=0;i<S.letters.length;i++)if(S.letters[i].id===id)return S.letters[i]}
function paras(box,txt){String(txt||'').split(/\n\s*\n/).forEach(function(p){if(!p.trim())return;var e=$('p');p.split('\n').forEach(function(l,i){if(i)e.appendChild($('br'));e.appendChild(document.createTextNode(l))});box.appendChild(e)})}
function img(src,c,alt){var i=$('img',c);i.src=src;i.alt=alt||'';return i}
function render(){
  app.innerHTML='';
  var h=decodeURIComponent(location.hash.slice(1));
  if(h&&find(h)){cur=h;hashMode=true}
  if(editing){editor();return}
  var L=cur&&find(cur);
  if(L&&L.enc)pinScreen(L);else if(L)viewLetter(L);else home();
  if(preview){var b=$('button','btn fab','← Quay lại chỉnh sửa');b.onclick=function(){preview=false;editing=true;cur=null;render()};app.appendChild(b)}
  else if(canEdit){var f=$('button','btn fab','✏️ Chỉnh sửa');f.onclick=function(){editing=true;render()};app.appendChild(f)}
}
function home(){
  var hd=$('header');hd.appendChild($('h1',null,S.title));hd.appendChild($('p','sub',S.sub));app.appendChild(hd);
  var i=$('input','pin');i.type='password';i.inputMode='numeric';i.autocomplete='off';i.maxLength=8;i.setAttribute('aria-label','Mật khẩu số');
  var er=$('p','err'),b=$('button','btn','Mở thư');b.type='button';
  i.oninput=function(){i.value=i.value.replace(/\D/g,'')};
  function go(){
    var pin=i.value;if(pin.length<4){er.textContent='Nhập đủ mật khẩu (ít nhất 4 số) nhé.';return}
    var hit=S.letters.filter(function(L){return !L.enc&&L.pin===pin})[0];
    if(hit){cur=hit.id;render();return}
    if(!(window.crypto&&crypto.subtle)){er.textContent='Trình duyệt này không mở khóa được.';return}
    er.textContent='Đang kiểm tra…';b.disabled=true;
    S.letters.filter(function(L){return L.enc}).reduce(function(p,L){return p.then(function(f){return f||dec(L,pin).then(function(d){Object.assign(L,d);delete L.enc;L.pin=pin;return L},function(){return null})})},Promise.resolve(null)).then(function(L){if(L){cur=L.id;render()}else{b.disabled=false;er.textContent='Sai mật khẩu, thử lại nhé.'}});
  }
  b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};
  app.appendChild(i);app.appendChild(b);app.appendChild(er);
}
function pinScreen(L){
  if(!hashMode){var bk=$('button','ghost','← Quay lại');bk.onclick=function(){cur=null;render()};app.appendChild(bk)}
  var hd=$('header');hd.appendChild($('h1',null,'Gửi '+(L.to||'')));hd.appendChild($('p','sub','🔒 Nhập mật khẩu (số) để mở thư'));app.appendChild(hd);
  var i=$('input','pin');i.type='password';i.inputMode='numeric';i.autocomplete='off';i.maxLength=8;i.setAttribute('aria-label','Mật khẩu số');
  var er=$('p','err'),b=$('button','btn','Mở thư');b.type='button';
  i.oninput=function(){i.value=i.value.replace(/\D/g,'')};
  function go(){
    if(!(window.crypto&&crypto.subtle)){er.textContent='Trình duyệt này không mở khóa được.';return}
    er.textContent='Đang kiểm tra…';var pin=i.value;
    dec(L,pin).then(function(p){Object.assign(L,p);delete L.enc;L.pin=pin;render()}).catch(function(){er.textContent='Sai mật khẩu, thử lại nhé.'});
  }
  b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};
  app.appendChild(i);app.appendChild(b);app.appendChild(er);
  setTimeout(function(){i.focus()},50);
}
function viewLetter(L){
  if(!hashMode){var bk=$('button','ghost','← Quay lại');bk.onclick=function(){cur=null;render()};app.appendChild(bk)}
  var hd=$('header');hd.appendChild($('h1',null,'Gửi '+(L.to||'')));if(L.sub)hd.appendChild($('p','sub',L.sub));app.appendChild(hd);
  if(L.cover){var fg=$('figure','meme');fg.appendChild(img(L.cover,null,'Ảnh'));app.appendChild(fg)}
  var env=$('button','envelope');env.type='button';env.setAttribute('aria-label','Mở phong thư');
  env.innerHTML='<span class="back"></span><span class="card"><i></i><i></i><i></i></span><span class="pocket"></span><span class="flap"></span><span class="seal">20/10</span>';
  var hint=$('p','hint','Chạm vào phong thư để mở');app.appendChild(env);app.appendChild(hint);
  var ov=$('div','overlay'),art=$('article','letter');ov.setAttribute('role','dialog');ov.appendChild(art);
  art.appendChild($('h2',null,L.head));paras(art,L.body);
  (L.imgs||[]).forEach(function(s){art.appendChild(img(s,'pic','Ảnh trong thư'))});
  var sg=$('p','sign');String(L.sign||'').split('\n').forEach(function(x,i){if(i)sg.appendChild($('br'));sg.appendChild(document.createTextNode(x))});art.appendChild(sg);
  var cl=$('button','close','Đóng thư');cl.type='button';art.appendChild(cl);app.appendChild(ov);
  var t;
  function show(){ov.classList.add('show');cl.focus();hint.textContent='Chạm vào phong thư để đọc lại'}
  env.onclick=function(){if(env.classList.contains('open'))return show();env.classList.add('open');t=setTimeout(show,1100)};
  function close(){clearTimeout(t);ov.classList.remove('show');env.classList.remove('open');env.focus()}
  cl.onclick=close;ov.onclick=function(e){if(e.target===ov)close()};
}
function fld(P,label,o,k,type,cb){
  var l=$('label',null,label),i=type==='ta'?$('textarea'):type==='s'?$('textarea','s'):$('input');
  i.value=o[k]||'';i.oninput=function(){o[k]=i.value;if(cb)cb(i.value)};l.appendChild(i);P.appendChild(l);
}
function shrink(file,cb){
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var m=1000,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);cb(c.toDataURL('image/jpeg',.78))};
  im.onerror=function(){URL.revokeObjectURL(u)};im.src=u;
}
function uploader(P,label,multi,add){
  var l=$('label',null,label),i=$('input');i.type='file';i.accept='image/*';i.multiple=!!multi;
  i.onchange=function(){var fs=Array.prototype.slice.call(i.files),n=fs.length;if(!n)return;fs.forEach(function(f){shrink(f,function(d){add(d);if(--n===0)render()})})};
  l.appendChild(i);P.appendChild(l);
}
function thumbs(P,arr){
  var w=$('div','thumbs');arr.forEach(function(s,idx){var t=$('div','t');t.appendChild(img(s));var x=$('button',null,'×');x.type='button';x.title='Xóa ảnh';x.onclick=function(){arr.splice(idx,1);render()};t.appendChild(x);w.appendChild(t)});
  if(arr.length)P.appendChild(w);
}
function editor(){
  var P=$('div','panel');P.appendChild($('h2',null,'Chỉnh sửa các lá thư'));
  fld(P,'Tiêu đề trang chủ',S,'title');fld(P,'Dòng phụ trang chủ',S,'sub');
  var sl=$('select');S.letters.forEach(function(L,i){var o=$('option',null,L.to||'(chưa có tên)');o.value=i;sl.appendChild(o)});sl.value=sel;
  sl.onchange=function(){sel=+sl.value;delArm=false;render()};
  var lb=$('label',null,'Chọn thư để sửa');lb.appendChild(sl);P.appendChild(lb);
  var r=$('div','row'),ad=$('button','btn alt','+ Thêm thư');ad.type='button';
  ad.onclick=function(){S.letters.push({id:'l'+Math.random().toString(36).slice(2,7),to:'',sub:'',head:'Gửi bạn,',body:'',sign:'Thân mến,\nEm Duy Do',cover:'',imgs:[]});sel=S.letters.length-1;render()};
  r.appendChild(ad);
  if(S.letters.length){var dl=$('button','btn alt',delArm?'Bấm lại để xóa thư này':'Xóa thư này');dl.type='button';dl.onclick=function(){if(!delArm){delArm=true;dl.textContent='Bấm lại để xóa thư này';return}S.letters.splice(sel,1);sel=Math.max(0,sel-1);delArm=false;render()};r.appendChild(dl)}
  P.appendChild(r);
  var L=S.letters[sel];
  if(L){
    fld(P,'Tên người nhận (hiện ở trang chủ)',L,'to',null,function(v){sl.options[sel].textContent=v||'(chưa có tên)'});
    fld(P,'Dòng phụ dưới tên',L,'sub');
    if(L.enc){
      P.appendChild($('p','note','🔒 Thư này đang khóa. Nhập mật khẩu của thư để mở khóa và sửa.'));
      var ui=$('input');ui.type='password';ui.inputMode='numeric';ui.maxLength=8;ui.oninput=function(){ui.value=ui.value.replace(/\D/g,'')};
      var ub=$('button','btn alt','Mở khóa để sửa');ub.type='button';var ue=$('p','note','');
      ub.onclick=function(){ue.textContent='Đang kiểm tra…';dec(L,ui.value).then(function(p){var pin=ui.value;Object.assign(L,p);delete L.enc;L.pin=pin;render()}).catch(function(){ue.textContent='Sai mật khẩu.'})};
      P.appendChild(ui);P.appendChild(ub);P.appendChild(ue);
    }else{
    fld(P,'Lời chào đầu thư',L,'head');
    fld(P,'Nội dung thư (cách một dòng trống để sang đoạn mới)',L,'body','ta');
    fld(P,'Người ký',L,'sign','s');
    uploader(P,'Ảnh phía trên phong thư (chọn ảnh mới sẽ thay ảnh cũ)',false,function(d){L.cover=d});
    if(L.cover)thumbs(P,coverArr(L));
    uploader(P,'Ảnh chèn trong thư (chọn được nhiều ảnh)',true,function(d){(L.imgs=L.imgs||[]).push(d)});
    thumbs(P,L.imgs||[]);
    var pl=$('label',null,'Mật khẩu số để mở thư (4–8 chữ số, để trống nếu không khóa)'),pi=$('input');pi.inputMode='numeric';pi.maxLength=8;pi.value=L.pin||'';
    pi.oninput=function(){pi.value=pi.value.replace(/\D/g,'');L.pin=pi.value};pl.appendChild(pi);P.appendChild(pl);
    }
    var lk=$('p','note','Link riêng cho người này: dán đuôi sau vào cuối link trang → ');lk.appendChild($('code',null,'#'+L.id));P.appendChild(lk);
  }
  var a=$('div','row'),pv=$('button','btn alt','Xem thử'),sv=$('button','btn','Lưu & xuất bản');pv.type=sv.type='button';
  pv.onclick=function(){editing=false;preview=true;cur=L?L.id:null;hashMode=false;render()};
  sv.onclick=save;a.appendChild(pv);a.appendChild(sv);P.appendChild(a);
  msgEl=$('p','note','Nhớ bấm “Lưu & xuất bản”, nếu không các thay đổi sẽ mất khi đóng trang. Hãy ghi lại mật khẩu từng người: quên là không lấy lại được.');P.appendChild(msgEl);
  app.appendChild(P);
}
function coverArr(L){var a=[L.cover];a.splice=function(i,n){L.cover='';return[]};return a}
function b64(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function key(pin,salt){return crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])})}
function enc(L){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),pl=JSON.stringify({head:L.head,body:L.body,sign:L.sign,cover:L.cover,imgs:L.imgs});
  return key(L.pin,salt).then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(pl))}).then(function(ct){return{s:b64(salt),i:b64(iv),d:b64(ct)}})}
function dec(L,pin){var e=L.enc;return key(pin,unb64(e.s)).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.i)},k,unb64(e.d))}).then(function(b){return JSON.parse(new TextDecoder().decode(b))})}
function ser(){return Promise.all(S.letters.map(function(L){
  var o={id:L.id,to:L.to,sub:L.sub};
  if(L.enc){o.enc=L.enc;return o}
  if(L.pin)return enc(L).then(function(e){o.enc=e;return o});
  o.head=L.head;o.body=L.body;o.sign=L.sign;o.cover=L.cover;o.imgs=L.imgs;return o})).then(function(ls){return{title:S.title,sub:S.sub,letters:ls}})}
function build(){return ser().then(function(D){
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';
  c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n'+c.outerHTML})}
function buildOld(){
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';
  c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
function save(){
  if(!cap){msgEl.textContent='Không kết nối được tính năng lưu. Hãy mở trang này trong claude.ai.';return}
  var bad=S.letters.filter(function(L){return L.pin&&L.pin.length<4});
  if(bad.length){msgEl.textContent='Mật khẩu của "'+(bad[0].to||'thư chưa có tên')+'" cần ít nhất 4 chữ số.';return}
  var seen={},dup=S.letters.filter(function(L){if(!L.pin)return false;if(seen[L.pin])return true;seen[L.pin]=1;return false})[0];
  if(dup){msgEl.textContent='Có hai thư đang dùng chung một mật khẩu, mỗi người cần một mật khẩu khác nhau.';return}
  if(S.letters.some(function(L){return L.pin})&&!(window.crypto&&crypto.subtle)){msgEl.textContent='Trình duyệt này không hỗ trợ khóa thư bằng mật khẩu.';return}
  msgEl.textContent='Đang mã hóa và lưu…';
  build().then(function(h){return cap.publish(h)}).catch(function(e){msgEl.textContent=e&&e.code==='conflict'?'Có người vừa sửa trang, trang sẽ tải lại bản mới.':'Không lưu được: '+((e&&(e.message||e.code))||'lỗi không rõ')});
}
window.addEventListener('hashchange',function(){if(!editing&&!preview){hashMode=false;cur=null;render()}});
render();
if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){
    cap=r[0];var u=r[1];canEdit=!!(cap&&u&&(u.isOwner()||u.canEdit()));if(canEdit&&!editing&&!preview)render();
  }).catch(function(){});
}
})();
</script>
